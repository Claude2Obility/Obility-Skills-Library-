<style>

body { font-family: 'Encode Sans', sans-serif; color: var(--color-text-primary); background: transparent; }

.filter-btn { font-size: 12px; font-family: 'Encode Sans', sans-serif; padding: 5px 12px; border-radius: 999px; border: 0.5px solid var(--color-border-secondary); background: transparent; color: var(--color-text-secondary); cursor: pointer; transition: all 0.15s; }
.filter-btn:hover { background: var(--color-background-secondary); }
.filter-btn.active { background: #000039; border-color: #000039; color: #fff; font-weight: 500; }

.controls { margin-bottom: 1rem; }
.search-wrap { position: relative; margin-bottom: 0.75rem; }

.card { background: var(--color-background-primary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); padding: 1rem 1.25rem; display: flex; flex-direction: column; gap: 8px; transition: border-color 0.15s; }

.card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.card-icon { width: 36px; height: 36px; border-radius: var(--border-radius-md); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

.badges { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.badge { font-size: 11px; font-weight: 500; font-family: 'Encode Sans', sans-serif; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
.badge-task { background: #eeeaff; color: #3a1f99; }
.badge-report { background: #fff0e0; color: #7a3d00; }
.badge-auto { background: #e0f0ff; color: #003d7a; }
.badge-soon { background: #F0F0F5; color: #555566; border: 0.5px solid #ccccd8; }
.icon-task { background: #eeeaff; color: #8C5AFF; }
.icon-report { background: #fff0e0; color: #FF9100; }
.icon-auto { background: #ffe0e6; color: #FF5078; }
.card-title { font-family: 'Encode Sans Condensed', sans-serif; font-size: 16px; font-weight: 600; line-height: 1.3; color: var(--color-text-primary); }
.card-desc { font-size: 13px; color: var(--color-text-secondary); line-height: 1.6; font-family: 'Encode Sans', sans-serif; }
.dept-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 2px; }
.dept-tag { font-size: 10px; font-family: 'Encode Sans', sans-serif; padding: 2px 8px; border-radius: 999px; background: var(--color-background-secondary); color: var(--color-text-secondary); border: 0.5px solid var(--color-border-tertiary); }
.empty { text-align: center; padding: 3rem 1rem; color: var(--color-text-secondary); font-size: 14px; grid-column: 1/-1; font-family: 'Encode Sans', sans-serif; }
.count { font-size: 13px; color: var(--color-text-secondary); margin-bottom: 0.5rem; font-family: 'Encode Sans', sans-serif; }
</style>

<div class="ob-header">
  <div class="ob-logo">
    <svg class="ob-logo-mark" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect width="32" height="32" rx="6" fill="#FF9100"/>
      <circle cx="16" cy="16" r="7" fill="#000039"/>

<div class="controls">

  { title: "Meeting Asana sync", cat: "task", icon: "ti-notes", live: true,

  { title: "Meeting internal notes", cat: "task", icon: "ti-edit", live: true,

  { title: "Meeting next steps", cat: "task", icon: "ti-file-text", live: true,

  { title: "Monthly report task creator", cat: "report", icon: "ti-calendar-stats", live: true,

  { title: "Obility PPTX", cat: "auto", icon: "ti-layout-grid", live: true,

  { title: "Obility writing style", cat: "auto", icon: "ti-pencil", live: true,
    depts: ALL_DEPTS,
    desc: "Applies Obility's house writing style to any piece of content — blog posts, landing pages, thought leadership, LinkedIn posts, or any other written deliverable." },
  { title: "Paid search negative keywords", cat: "auto", icon: "ti-ban", live: true,

  { title: "Paid search STR classification", cat: "report", icon: "ti-tags", live: true,

  { title: "Report task creator", cat: "report", icon: "ti-calendar-stats", live: true,

  { title: "SAM meeting task creator", cat: "task", icon: "ti-calendar", live: true,

  { title: "SPS GEO tracker sync", cat: "auto", icon: "ti-repeat", live: true,

  { title: "Excel builder (XLSX)", cat: "auto", icon: "ti-tool", live: true,

  { title: "PDF builder", cat: "auto", icon: "ti-tool", live: true,

  { title: "PowerPoint builder (PPTX)", cat: "auto", icon: "ti-layout-grid", live: true,

  { title: "Obility PPC budget pacing", cat: "report", icon: "ti-ad", live: true,

  { title: "Obility SEO content optimization", cat: "report", icon: "ti-search", live: true,
    lastUpdated: "06/01/2026",
    depts: ["SEO/GEO"],
    desc: "Generates a branded SEO Content Optimization report as a .docx file for a given URL and target keywords — auditing page content against SEO best practices." },
  { title: "Reddit response", cat: "auto", icon: "ti-edit", live: true,
    lastUpdated: "06/01/2026",
    depts: ["Content","SEO/GEO"],
    desc: "Writes a Reddit response on behalf of an Obility client — reads the thread, drafts a relevant and on-brand reply that fits the platform's conversational tone." },
  { title: "SEO/GEO assessment", cat: "report", icon: "ti-calendar-stats", live: true,
    lastUpdated: "06/01/2026",
    depts: ["SEO/GEO"],
    desc: "Runs a full SEO and GEO assessment for a prospect or client — keyword trends, AI visibility, content gaps, and competitor comparisons delivered as a branded PowerPoint deck." },
];

const badgeClass = { task: "badge-task", report: "badge-report", auto: "badge-auto" };
const iconClass  = { task: "icon-task",  report: "icon-report",  auto: "icon-auto"  };
const catLabel   = { task: "Task & project management", report: "Reporting & insights", auto: "Automation & workflows" };

let activeCat  = "all";
let activeDept = "All";

function initFilters() {
  const cf = document.getElementById("cat-filters");
  cats.forEach(c => {
    const btn = document.createElement("button");
    btn.className = "filter-btn" + (c.id === "all" ? " active" : "");
    btn.textContent = c.label;
    btn.onclick = () => {
      activeCat = c.id;
      document.querySelectorAll("#cat-filters .filter-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      render();
    };
    cf.appendChild(btn);
  });

  const df = document.getElementById("dept-filters");
  depts.forEach(d => {
    const btn = document.createElement("button");
    btn.className = "filter-btn" + (d === "All" ? " dept-active" : "");
    btn.textContent = d;
    btn.onclick = () => {
      activeDept = d;
      document.querySelectorAll("#dept-filters .filter-btn").forEach(b => b.classList.remove("dept-active"));
      btn.classList.add("dept-active");
      render();
    };
    df.appendChild(btn);
  });
}

function render() {
  const q = document.getElementById("search").value.toLowerCase();
  const filtered = skills.filter(s => {
    const matchCat  = activeCat === "all" || s.cat === activeCat;
    const matchDept = activeDept === "All" || s.depts.includes(activeDept);
    const matchQ    = !q || s.title.toLowerCase().includes(q) || s.desc.toLowerCase().includes(q);
    return matchCat && matchDept && matchQ;
  });

  const grid = document.getElementById("grid");
  const live = filtered.filter(s => s.live).length;
  const soon = filtered.filter(s => !s.live).length;
  let parts = [filtered.length + " skill" + (filtered.length !== 1 ? "s" : "")];
  if (live) parts.push(live + " live");
  if (soon) parts.push(soon + " coming soon");
  document.getElementById("count").textContent = parts.join(" — ");

  if (!filtered.length) {
    grid.innerHTML = '<p class="empty">No skills match your search.</p>';
    return;
  }

  grid.innerHTML = filtered.map(s => {
    const isAll = s.depts.length === ALL_DEPTS.length;
    const deptHtml = isAll
      ? `<span class="dept-tag">All departments</span>`
      : s.depts.map(d => `<span class="dept-tag">${d}</span>`).join("");
    return `
    <div class="card${s.live ? "" : " coming-soon"}">
      <div class="card-top">
        <div class="card-icon ${iconClass[s.cat]}"><i class="ti ${s.icon}" aria-hidden="true"></i></div>
        <div class="badges">
          <span class="badge ${badgeClass[s.cat]}">${catLabel[s.cat]}</span>
          ${!s.live ? '<span class="badge badge-soon">Coming soon</span>' : ""}
        </div>
      </div>
      <p class="card-title">${s.title}</p>
      <p class="card-desc">${s.desc}</p>
      <div class="dept-tags">${deptHtml}</div>
    </div>`;
  }).join("");
}

initFilters();
render();
</script>
